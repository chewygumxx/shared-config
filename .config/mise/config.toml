# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise.json

#
#
# ~chewygumxx/shared-config.git
# ::: :/.config/mise/config.toml
#
#

min_version = "2026.11.6"

[tools]
bun                                              = "1.4"
node                                             = "24"
"aqua:jdx/hk"                                    = "2.13.0"
"aqua:astral-sh/uv"                              = "0.12.19"
"pypi:yamllint"                                  = { version = "1.38.0", depends = [ "aqua:astral-sh/uv" ] }
"aqua:tombi-toml/tombi"                          = "1.11.3"
"aqua:koalaman/shellcheck"                       = "0.11.0"
"aqua:mvdan/sh"                                  = "3.14.1"
"aqua:editorconfig-checker/editorconfig-checker" = "4.0.2"
"aqua:rhysd/actionlint"                          = "1.7.12"

[env]
SHELLCHECK_OPTS      = "--rcfile={{config_root}}/packages/shellcheck-config/config.shellcheckrc"
YAMLLINT_CONFIG_FILE = "{{config_root}}/packages/yamllint-config/config.yaml"

[hooks]
postinstall = "hk install --mise"

[task_config]
includes = [ ".config/mise/tasks/*.task.toml" ]

[task_templates.staged]
usage = '''
flag "--staged" negate="--all" default=#true {
    help "Select staged paths, or all tracked paths with --all"
}
'''

[task_templates."staged:cached"]
usage   = '''
flag "--staged" negate="--all" default=#true {
    help "Select staged paths, or all tracked paths with --all"
}
'''
sources = [
    "**/*",
    "!.git/**",
    "!node_modules/**",
    "{% if usage.staged %}{{ exec(command=\"git rev-parse --path-format=absolute --git-path index\") }}{% endif %}",
]
outputs = { auto = true }

[settings]
# Remote file tasks, such as act-cached, are experimental.
experimental = true
