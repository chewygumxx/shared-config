# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise-task.json

#
#
# ~chewygumxx/shared-config.git
# ::: :/.config/mise/tasks.toml
#
#

#
# https://mise.jdx.dev/tasks/task-configuration.html
#


[install]
extends      = "cgxx:install"
depends_post = [ "install:vendir" ]

["install:vendir"]
extends      = "cgxx:install:vendir"
depends_post = [ "format:vendir" ]
hide         = true

["format:vendir"]
run  = "bun run prettier --config .config/prettierrc.json --write .config/vendir.lock.yml"
hide = true

[commit]
extends = "cgxx:commit"

["commit:lint"]
extends = "cgxx:commit:lint"
alias   = "lint:commit"

[format]
extends = "cgxx:format"

[lint]
extends = "cgxx:lint"

[test]
extends = "cgxx:test"
run     = "bun test ./packages/*/test.js ./packages/create-repo/test/"

[check]
extends = "cgxx:check"

[act]
extends = "cgxx:act"

["templates:materialize"]
description = "Write every repository template under .templates"
run         = "bun packages/create-repo/scripts/materialize.js --all .templates"

["templates:verify"]
description = "Dry-run templates from the packed scaffolder"
usage       = '''
flag "--registry" help="Use the registry pins and lockfiles as bundled"
flag "--template <template>" help="Verify one template and all its features"
'''
run         = "bun packages/create-repo/scripts/verify-templates.js {% if usage.registry %}--registry{% endif %} {% if usage.template %}--template {{ usage.template | quote }}{% endif %}"
