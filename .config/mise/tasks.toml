#:schema https://mise.jdx.dev/schema/mise-task.json

#
#
# ~chewygumxx/shared-config.git
# ::: :/.config/mise/tasks.toml
#
#

#
# https://mise.jdx.dev/tasks/task-configuration.html
#


[install]
extends = "cgxx:install"

[commit]
extends = "cgxx:commit"

["commit:lint"]
extends = "cgxx:commit:lint"
alias   = "lint:commit"

[format]
extends = "cgxx:format"

[lint]
extends = "cgxx:lint"

[test]
extends = "cgxx:test"
run     = "bun test ./packages/*/test.js"

[check]
extends = "cgxx:check"

[act]
extends = "cgxx:act"
