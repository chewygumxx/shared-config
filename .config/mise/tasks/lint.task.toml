# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only
#:schema https://mise.jdx.dev/schema/mise-task.json

#
#
# ~chewygumxx/shared-config.git
# ::: :/.config/mise/tasks/lint.task.toml
#
#

#
# https://mise.jdx.dev/tasks/task-configuration.html
#
# Each file-based linter acts on staged files alone unless given --all,
# which lint passes on. The templates in .config/mise/config.toml declare
# the flag.
#

[lint]
description = "Run every linter and format check"
alias       = "l"
extends     = "staged"
depends     = [
    "lint:actions      {% if not usage.staged %}--all{% endif %}",
    "lint:biome        {% if not usage.staged %}--all{% endif %}",
    "lint:editorconfig {% if not usage.staged %}--all{% endif %}",
    "lint:emdash       {% if not usage.staged %}--all{% endif %}",
    "lint:md           {% if not usage.staged %}--all{% endif %}",
    "lint:secrets      {% if not usage.staged %}--all{% endif %}",
    "lint:sh           {% if not usage.staged %}--all{% endif %}",
    "lint:spell        {% if not usage.staged %}--all{% endif %}",
    "lint:toml         {% if not usage.staged %}--all{% endif %}",
    "lint:yaml         {% if not usage.staged %}--all{% endif %}",
    "lint:deps",
    "lint:lockfile",
    "lint:package",
    "lint:types",
]


# --------------------
# Lint: file by file
# --------------------

["lint:actions"]
description = "Lint GitHub workflows with actionlint"
extends     = "staged:cached"
sources     = [
    ".github/workflows/*.yaml",
    ".github/workflows/*.yml",
    ".github/actionlint.yaml",
    "packages/actionlint-config/**",
    "packages/shellcheck-config/**",
    ".config/mise/config.toml",
    "{% if usage.staged %}{{ exec(command=\"git rev-parse --path-format=absolute --git-path index\") }}{% endif %}",
]
run         = """
scripts/with-files.sh --widen-on .github/actionlint.yaml --widen-on packages/actionlint-config --widen-on packages/shellcheck-config '.github/workflows/*.yaml' '.github/workflows/*.yml' -- actionlint
"""

["lint:biome"]
description = "Lint and check formatting with Biome"
extends     = "staged:cached"
run         = "scripts/with-files.sh --widen-on .biome.json --widen-on packages/biome-config -- bun run biome ci --no-errors-on-unmatched --files-ignore-unknown=true"

["lint:editorconfig"]
description = "Check files against .editorconfig"
extends     = "staged:cached"
run         = "scripts/with-files.sh --widen-on .editorconfig --widen-on packages/editorconfig-checker-config -- editorconfig-checker -config packages/editorconfig-checker-config/config.json"

["lint:emdash"]
description = "Refuse em dashes"
extends     = "staged:cached"
run         = "scripts/lint-emdash.sh"

["lint:md"]
description = "Lint Markdown with remark and markdownlint"
extends     = "staged:cached"
sources     = [
    "**/*.md",
    "!node_modules/**",
    ".config/remarkrc.json",
    ".markdownlint-cli2.jsonc",
    "packages/remark-preset/**",
    "packages/markdownlint-cli2-config/**",
    "bun.lock",
    ".config/mise/config.toml",
    "{% if usage.staged %}{{ exec(command=\"git rev-parse --path-format=absolute --git-path index\") }}{% endif %}",
]
run         = [
    "scripts/with-files.sh --widen-on .config/remarkrc.json --widen-on .markdownlint-cli2.jsonc --widen-on packages/remark-preset --widen-on packages/markdownlint-cli2-config '*.md' -- bun run remark --rc-path .config/remarkrc.json --frail --quiet --no-stdout",
    "scripts/with-files.sh --widen-on .config/remarkrc.json --widen-on .markdownlint-cli2.jsonc --widen-on packages/remark-preset --widen-on packages/markdownlint-cli2-config '*.md' -- bun run markdownlint-cli2",
]

["lint:secrets"]
description = "Scan for secrets with secretlint --no-gitignore"
extends     = "staged:cached"
run         = "scripts/with-files.sh --widen-on .secretlintrc.json --widen-on packages/secretlint-rule-preset -- bun run secretlint --no-gitignore"

["lint:sh"]
description = "Lint shell scripts with shfmt and ShellCheck"
shell       = "bash -o pipefail -c"
extends     = "staged:cached"
run         = [
    "scripts/with-files.sh --widen-on .editorconfig --widen-on packages/shellcheck-config -- shfmt --find=0 | xargs -0 -r shfmt -d",
    "scripts/with-files.sh --widen-on .editorconfig --widen-on packages/shellcheck-config -- shfmt --find=0 | xargs -0 -r shellcheck",
]

["lint:spell"]
description = "Check spelling with cspell"
extends     = "staged:cached"
run         = "scripts/with-files.sh --widen-on .config/cspell.json --widen-on packages/cspell-config -- bun run cspell --no-progress --no-summary --no-must-find-files"

["lint:toml"]
description = "Lint and check formatting of TOML with Tombi"
extends     = "staged:cached"
sources     = [
    "**/*.toml",
    "!node_modules/**",
    ".config/tombi.toml",
    "packages/tombi-config/**",
    ".config/mise/config.toml",
    "{% if usage.staged %}{{ exec(command=\"git rev-parse --path-format=absolute --git-path index\") }}{% endif %}",
]
run         = [
    "scripts/with-files.sh --widen-on .config/tombi.toml --widen-on packages/tombi-config '*.toml' -- tombi format --check --offline --",
    "scripts/with-files.sh --widen-on .config/tombi.toml --widen-on packages/tombi-config '*.toml' -- tombi lint --error-on-warnings --offline --",
]

# The actionlint symlink points to the package config, which is checked directly.
["lint:yaml"]
description = "Lint and check formatting of YAML with Prettier and yamllint"
extends     = "staged:cached"
sources     = [
    "**/*.yaml",
    "**/*.yml",
    "!node_modules/**",
    ".editorconfig",
    ".config/prettierrc.json",
    "packages/prettier-config/**",
    "packages/yamllint-config/**",
    "bun.lock",
    ".config/mise/config.toml",
    "{% if usage.staged %}{{ exec(command=\"git rev-parse --path-format=absolute --git-path index\") }}{% endif %}",
]
run         = [
    "scripts/with-files.sh --widen-on .editorconfig --widen-on .config/prettierrc.json --widen-on packages/prettier-config --widen-on packages/yamllint-config '*.yaml' '*.yml' ':!.github/actionlint.yaml' -- bun run prettier --config .config/prettierrc.json --check",
    "scripts/with-files.sh --widen-on .editorconfig --widen-on .config/prettierrc.json --widen-on packages/prettier-config --widen-on packages/yamllint-config '*.yaml' '*.yml' ':!.github/actionlint.yaml' -- yamllint --strict",
]

# ---------------------
# Lint: whole project
# ---------------------

["lint:deps"]
description = "Find unused files and dependencies with knip"
run         = "bun run knip"

["lint:lockfile"]
description = "Verify the workspace versions recorded in bun.lock"
run         = "bun scripts/check-workspace-versions.mjs"

["lint:package"]
description = "Check all package manifests, published files and types"
run         = [
    "bun run sort-package-json --check package.json packages/*/package.json",
    "scripts/lint-packages.sh",
]

["lint:types"]
description = "Type-check with tsc"
run         = "bun run tsc"

["lint:commit"]
description = "Lint a commit message file with commitlint"
usage       = 'arg "<file>" help="The commit message file"'
run         = 'bun run commitlint --edit "$usage_file"'

["lint:headers"]
description = "Verify files' repository and path header lines"
run         = "bun run sync-header-metadata"
