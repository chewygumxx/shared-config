#
#
# ~chewygumxx/shared-config.git
# ::: :/.github/workflows/ci.yaml
#
#

# The shared standard checks (commitlint, header sync, generic lint and
# format), then this repository's own `bun run check` against the commit the
# header sync pushed. See chewygumxx/.github for each part. There is no
# .repo-metadata.jsonc here, so the metadata sync is off.

name: CI

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

permissions:
    contents: write
    pull-requests: read

# Not cancelled in progress: a newer run must not interrupt the header sync
# part-way through its commit.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    standard:
        uses: chewygumxx/.github/.github/workflows/standard.yaml@v1
        with:
            metadata-sync: false
            yaml: false

    check:
        needs: standard
        if: ${{ !cancelled() }}
        permissions:
            contents: read
        uses: chewygumxx/.github/.github/workflows/lint.yaml@v1
        with:
            ref: ${{ needs.standard.outputs.sha }}

    release-preflight:
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release-please--branches--main'
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout Proposed Release
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set Up mise
              uses: jdx/mise-action@v4
              env:
                  MISE_NO_HOOKS: "1"

            - name: Check Proposed Versions
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: bun scripts/release-status.mjs --check --base "$BASE_SHA"
