#
#
# ~chewygumxx/shared-config.git
# ::: :/.github/workflows/publish.yaml
#
#

# Publishes one workspace package per `<package>@<version>` tag, e.g.
# `biome-config@1.1.0` publishes `packages/biome-config` if its version
# matches.
#
# Authentication is npm trusted publishing: npm exchanges this job's OIDC
# token for a short-lived publish credential, so no NPM_TOKEN secret exists.
# Each package must first be published once by hand, then have this
# repository and workflow added under its npm Settings > Trusted Publisher.

name: Publish

on:
    push:
        tags:
            - "*@*"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    check:
        uses: chewygumxx/.github/.github/workflows/lint.yaml@v1

    publish:
        needs: check
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node and NPM
              uses: jdx/mise-action@v4

            - name: NPM Clean Install
              run: npm ci

            - name: Resolve Package
              id: package
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  name="${TAG%@*}"
                  version="${TAG##*@}"
                  dir="packages/$name"
                  test -f "$dir/package.json" || { echo "::error::No package at $dir"; exit 1; }
                  actual=$(node -p "require('./$dir/package.json').version")
                  test "$actual" = "$version" || { echo "::error::$dir is $actual, tag says $version"; exit 1; }
                  echo "dir=$dir" >> "$GITHUB_OUTPUT"

            - name: Publish
              env:
                  DIR: ${{ steps.package.outputs.dir }}
              run: npm stage publish --workspace "$DIR"
