name: Publish

on:
    release:
        types:
            - published

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        permissions:
            actions: read
            contents: read
            id-token: write

        outputs:
            name: ${{ steps.package.outputs.name }}
            version: ${{ steps.package.outputs.version }}
            integrity: ${{ steps.package.outputs.integrity }}

        steps:
            - name: Checkout Release Commit
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Set Up Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Find Verified Release Bundle
              id: bundle
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  source=$(node scripts/release-ci.mjs "$GITHUB_SHA")
                  jq -er 'select((.runId | type) == "number" and (.artifactId | type) == "number") |
                      "run=\(.runId)", "artifact=\(.artifactId)"' <<< "$source" >> "$GITHUB_OUTPUT"

            - name: Download Verified Release Bundle
              uses: actions/download-artifact@v8
              with:
                  github-token: ${{ github.token }}
                  repository: ${{ github.repository }}
                  run-id: ${{ steps.bundle.outputs.run }}
                  artifact-ids: ${{ steps.bundle.outputs.artifact }}
                  path: ${{ runner.temp }}/release

            - name: Identify and Verify the Release Tarball
              id: package
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  package=$(node scripts/release-artifacts.mjs select "$RUNNER_TEMP/release" "$GITHUB_SHA" "$TAG")
                  jq -er '"name=\(.name)", "version=\(.version)", "integrity=\(.integrity)", "tarball=\(.tarball)"' \
                      <<< "$package" >> "$GITHUB_OUTPUT"

            - name: Publish with npm Trusted Publishing
              env:
                  TARBALL: ${{ steps.package.outputs.tarball }}
                  PACKAGE: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
              run: |
                  npm publish "$TARBALL" --ignore-scripts --provenance
                  printf 'npm accepted %s from the verified CI bundle.\n' "$PACKAGE" >> "$GITHUB_STEP_SUMMARY"

    registry:
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 18

        steps:
            - name: Checkout Release Commit
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Set Up Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Verify npm Tarball
              env:
                  NAME: ${{ needs.publish.outputs.name }}
                  VERSION: ${{ needs.publish.outputs.version }}
                  INTEGRITY: ${{ needs.publish.outputs.integrity }}
              run: |
                  if node scripts/npm-registry.mjs "$NAME" "$VERSION" "$INTEGRITY"; then
                      printf '%s@%s is downloadable from npm and matches the CI tarball.\n' "$NAME" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
                  else
                      printf 'npm accepted %s@%s. Re-run failed jobs to retry registry verification.\n' "$NAME" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
                      exit 1
                  fi
