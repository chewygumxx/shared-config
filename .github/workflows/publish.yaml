#
#
# ~chewygumxx/shared-config.git
# ::: :/.github/workflows/publish.yaml
#
#

# Stages one workspace package per `<package>@<version>` tag, e.g.
# `biome-config@1.1.0` stages `packages/biome-config` if its version matches.
# A staged version is not installable until it is approved on npmjs.com with
# the maintainer's 2FA, so this workflow alone can never release a package.
#
# Authentication is npm trusted publishing: npm exchanges this job's OIDC
# token for a short-lived credential, so no NPM_TOKEN secret exists. Each
# package must first be published once by hand, then have this repository
# and workflow added under its npm Settings > Trusted Publisher with the
# stage publish permission.

name: Publish

on:
    push:
        tags:
            - "*@*"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    check:
        uses: chewygumxx/.github/.github/workflows/lint.yaml@v1

    publish:
        needs: check
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Bun and Node
              uses: jdx/mise-action@v4

            - name: Bun Install
              run: bun install --frozen-lockfile

            - name: Resolve Package
              id: package
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  name="${TAG%@*}"
                  version="${TAG##*@}"
                  dir="packages/$name"
                  test -f "$dir/package.json" || { echo "::error::No package at $dir"; exit 1; }
                  actual=$(bun -p "require('./$dir/package.json').version")
                  test "$actual" = "$version" || { echo "::error::$dir is $actual, tag says $version"; exit 1; }
                  echo "dir=$dir" >> "$GITHUB_OUTPUT"

            # npm, from mise's Node: Bun cannot stage a publish or publish by
            # trusted publishing.
            - name: Publish
              env:
                  DIR: ${{ steps.package.outputs.dir }}
              run: npm stage publish --workspace "$DIR"
