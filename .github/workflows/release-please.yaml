name: Release Please

on:
    push:
        branches:
            - main
    workflow_dispatch: {}

permissions:
    actions: read
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    release:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Main
              uses: actions/checkout@v7
              with:
                  ref: main
                  persist-credentials: false

            - name: Set Up mise
              uses: jdx/mise-action@v4
              env:
                  MISE_NO_HOOKS: "1"

            - name: Install Release Tooling
              run: bun install --frozen-lockfile --ignore-scripts

            # App events trigger CI on the release PR and publishing on releases.
            - name: Mint App Token
              id: app
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - name: Prepare or Publish Releases
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TOKEN: ${{ steps.app.outputs.token }}
              run: bun scripts/release-please.mjs
