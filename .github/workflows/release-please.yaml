name: Release Please

on:
    push:
        branches:
            - main
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    release:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            # App events trigger CI on the release PR and publishing on releases.
            - name: Mint App Token
              id: app
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - name: Release Please
              uses: googleapis/release-please-action@v5
              with:
                  token: ${{ steps.app.outputs.token }}
                  target-branch: main
                  config-file: .config/release-please.json
                  manifest-file: .config/release-please-manifest.json

    lockfile:
        needs: release
        runs-on: ubuntu-latest

        env:
            BRANCH: release-please--branches--main

        steps:
            - name: Mint App Token
              id: app
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - name: Find Open Release Pull Request
              id: pr
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
              run: |
                  sha=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
                      -f state=open -f base=main -f "head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}" \
                      --jq '.[0].head.sha // empty')
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"

            - name: Checkout Release Pull Request
              if: steps.pr.outputs.sha != ''
              uses: actions/checkout@v7
              with:
                  ref: ${{ steps.pr.outputs.sha }}
                  token: ${{ steps.app.outputs.token }}

            - name: Set Up mise
              if: steps.pr.outputs.sha != ''
              uses: jdx/mise-action@v4

            - name: Refresh and Verify Bun Lockfile
              if: steps.pr.outputs.sha != ''
              run: |
                  bun install --lockfile-only --ignore-scripts
                  bun scripts/check-workspace-versions.mjs

            - name: Commit Bun Lockfile
              if: steps.pr.outputs.sha != ''
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  SLUG: ${{ steps.app.outputs.app-slug }}
              run: |
                  if git diff --quiet -- bun.lock; then
                      echo "Bun lockfile already matches the release"
                      exit 0
                  fi

                  id=$(gh api "/users/${SLUG}[bot]" --jq .id)
                  git config user.name "${SLUG}[bot]"
                  git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
                  git commit -m "build: Refresh the release lockfile" -- bun.lock
                  git push origin "HEAD:refs/heads/${BRANCH}"
