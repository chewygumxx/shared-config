#:schema https://mise.jdx.dev/schema/mise.json

#
#
# ~chewygumxx/shared-config.git
# ::: :/mise.toml
#
#

#
# https://mise.jdx.dev/configuration.html
#
# The development toolchain for this repository, in one place.
#

# -------------
# File Purpose
# -------------
# Development tools this repository utilises, that is not an NPM package, is
# specified here such that a checkout is never dependant upon unspecified
# tooling. NPM package specification is instead pinned within `package.json`.
# Together, this file and packages.json define the entire dependency surface.
# CI refers to this file via `jdx/mise-action`, to ensure consistency.
#
# Backends are named explicitly rather than relying on the registry alias,
# such that resolution is detailed here and immutable.

min_version = "2026.9.0"

# ------
# Tools
# ------
[tools]
# Bun installs the packages and runs the scripts and tests. Node is here only
# for npm, which publishes the packages (`npm stage publish`, which Bun
# cannot do).
bun  = "1.4"
node = "24"

# yamllint is a Python tool, installed with the uv pinned beside it.
# Configuration is imported from `@chewygumxx/yamllint-config` in `package.json`
# prettier, which formats YAML, is pinned within `package.json`.
"aqua:astral-sh/uv" = "0.12.19"
"pypi:yamllint"     = "1.38.0"

# tombi formats and lints TOML, matching the version CI installs.
# Configuration is the house style in `tombi.toml`.
"aqua:tombi-toml/tombi" = "1.5.5"

# shellcheck lints the shell scripts by `@chewygumxx/shellcheck-config`'s
# source, named with `--rcfile`; shfmt formats them by `.editorconfig`. Both
# match the versions CI installs.
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh"            = "3.14.1"

# editorconfig-checker holds every tracked file to `.editorconfig`, by
# `.editorconfig-checker.json`, a link to
# `@chewygumxx/editorconfig-checker-config`'s source. It matches the version
# CI installs.
"aqua:editorconfig-checker/editorconfig-checker" = "4.0.2"

# actionlint checks the workflows, and their `run:` scripts with the
# shellcheck above. It matches the version CI installs.
"aqua:rhysd/actionlint" = "1.7.12"

[settings]
#
# Refetch remote tasks each time one runs, so `act` follows `v1` as it
# moves; mise otherwise keeps its first copy for good.
#
task.remote_no_cache = true

[tasks.act]
#
# Runs CI locally in Docker; see the `chewygumxx/.github` README.
#
description = "Run CI locally with act"
file        = "git::https://github.com/chewygumxx/.github.git//tasks/act?ref=v1"
