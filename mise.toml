#

#
# https://mise.jdx.dev/configuration.html
#
# The development toolchain for this repository, in one place.
#

# -------------
# File Purpose
# -------------
# Development tools this repository utilises, that is not an NPM package, is
# specified here such that a checkout is never dependant upon unspecified
# tooling. NPM package specification is instead pinned within `package.json`.
# Together, this file and packages.json define the entire dependency surface.
# CI refers to this file via `jdx/mise-action`, to ensure consistency.
#
# Backends are named explicitly rather than relying on the registry alias,
# such that resolution is detailed here and immutable.

min_version = "2026.9.0"

# ------
# Tools
# ------
[tools]
node = "24"

# ** YAML **
# yamllint is a Python tool, installed with the uv pinned beside it.
# Configuration is imported from `@chewygumxx/yamllint-config` in `package.json`
# prettier, which formats YAML, is pinned within `package.json`.
"aqua:astral-sh/uv" = "0.12.19"
"pypi:yamllint" = "1.38.0"
