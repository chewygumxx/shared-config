#
#
# ~chewygumxx/shared-config.git
# ::: :/tombi.toml
#
#

# https://tombi-toml.github.io/tombi/docs/configuration
#
# The house style, copied from chewygumxx/.github `actions/config/tombi`.
# CI points tombi at that copy as a user-level configuration, which this
# repository-level file overrides, so the pre-commit hook and CI agree.

toml-version = "v1.1.0"

[format]
[format.rules]
array-bracket-space-width       = 1
date-time-delimiter             = "space"
group-blank-lines-limit         = 2
indent-width                    = 4
key-value-equals-sign-alignment = true
trailing-comment-alignment      = true
trailing-comment-space-width    = 2
